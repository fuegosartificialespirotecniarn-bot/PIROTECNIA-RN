<!DOCTYPE html>
<html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Generar contraseña · Pirotecnia RN</title><link rel="stylesheet" href="styles.css">
<style>.box{max-width:640px;margin:40px auto;padding:0 20px;display:grid;gap:14px}input,textarea{padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);color:var(--tx);font:inherit;width:100%}</style></head>
<body><div class="box">
<h1>Generar contraseña</h1>
<p class="lead">Escribí la contraseña que querés usar. Todo se calcula en tu navegador; no se envía a ningún lado.</p>
<input type="password" id="p" placeholder="Contraseña (mínimo 10 caracteres)" autocomplete="new-password">
<button class="btn solid" id="go">Generar</button>
<textarea id="out" rows="4" readonly placeholder="Acá aparece lo que tenés que pegar en config.js"></textarea>
<p class="note">Después de pegarlo en <b>config.js</b>, podés borrar este archivo (hash.html) del repositorio.</p>
</div>
<script src="lock.js"></script>
<script>
document.getElementById("go").onclick = async () => {
  const p = document.getElementById("p").value;
  if (p.length < 10) return alert("Usá al menos 10 caracteres.");
  const iter = 210000, salt = btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(16))));
  const hash = await pbkdf2(p, salt, iter);
  document.getElementById("out").value = `window.ADMIN = { salt: "${salt}", hash: "${hash}", iter: ${iter} };`;
};
</script></body></html>
